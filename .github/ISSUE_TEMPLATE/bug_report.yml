name: Bug report
description: Something doesn't route, match, or respond the way the docs say.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - "@sabit/router"
        - "@sabit/express"
        - "@sabit/hono"
        - "@sabit/fastify"
        - "@sabit/nest"
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Route files
      description: The smallest route tree that shows the problem, with file contents.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Request, expected and actual response
      placeholder: "GET /users/42 → expected 200 { id: '42' }, got 404"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "@sabit/express 0.1.0, express 5.3.0, Node 24.19"
    validations:
      required: true
